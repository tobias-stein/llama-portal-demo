<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a Stay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/booking.css">
</head>
<body>

<div class="page">
  <!-- Top nav -->
  <nav class="topbar">
    <div class="brand">
      <img src="img/llama.svg" alt="Llama Portal Icon" class="brand-icon">
      <span class="brand-name">Llama&nbsp;Portal</span>
    </div>
    <div class="user-pill">
      <span class="dot"></span>
      <span id="user-email-display">Anonymous</span>
    </div>
  </nav>

  <!-- Title -->
  <div class="page-title">
    <h1>Reserve your <em>stay</em></h1>
    <p>Select dates &amp; complete your booking request</p>
  </div>

  <!-- Main card -->
  <div class="card">
    <div class="card-grid">

      <!-- LEFT: Calendar -->
      <div class="calendar-block">
        <div class="cal-header">
          <span class="cal-label">Select check-in &amp; check-out</span>
          <div class="cal-nav">
            <button class="cal-nav-btn" id="cal-prev" aria-label="Previous month">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15,18 9,12 15,6"/>
              </svg>
            </button>
            <button class="cal-nav-btn" id="cal-next" aria-label="Next month">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9,18 15,12 9,6"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="months-wrap" id="months-wrap"></div>
        <div class="cal-legend">
          <div class="legend-item"><div class="legend-dot avail"></div><span>Available</span></div>
          <div class="legend-item"><div class="legend-dot selected"></div><span>Check-in / out</span></div>
          <div class="legend-item"><div class="legend-dot range"></div><span>Your stay</span></div>
          <div class="legend-item"><div class="legend-dot unavail"></div><span>Unavailable</span></div>
        </div>
      </div>

      <!-- RIGHT: Form -->
      <div class="form-col">
        <div class="summary-box">
          <div class="summary-row"><span class="summary-key">Check-in</span><span class="summary-val empty-val" id="sum-checkin">— select date</span></div>
          <div class="summary-row"><span class="summary-key">Check-out</span><span class="summary-val empty-val" id="sum-checkout">— select date</span></div>
          <div class="summary-row"><span class="summary-key">Nights</span><span class="summary-val empty-val" id="sum-nights">—</span></div>
        </div>
        <div class="form-section-label">Guest details</div>
        <div class="fields">
          <div class="field">
            <label>Number of guests</label>
            <div class="counter-wrap">
              <button class="counter-btn" id="guests-minus" type="button">−</button>
              <span class="counter-val" id="guests-val">2</span>
              <button class="counter-btn" id="guests-plus"  type="button">+</button>
            </div>
          </div>
          <div class="field">
            <label for="name">Full name</label>
            <div class="input-wrap">
              <input type="text" id="name" placeholder="Jane Smith" autocomplete="name" />
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
            </div>
          </div>
          <div class="field">
            <label for="email">Email address</label>
            <div class="input-wrap">
              <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><polyline points="3,5 12,13 21,5"/></svg>
            </div>
          </div>
          <div class="field">
            <label for="notes">Special requests <span style="color:var(--muted);font-size:.6rem">(optional)</span></label>
            <div class="input-wrap">
              <input type="text" id="notes" placeholder="e.g. late check-in, dietary needs…" />
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </div>
          </div>
        </div>
        <div class="error-msg"   id="error-msg"></div>
        <div class="success-msg" id="success-msg">✓ Request sent! We'll confirm via email shortly.</div>
        <button class="btn" id="submit-btn" type="button">
          <span class="btn-text">Request Booking</span>
          <div class="spinner"></div>
        </button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
