<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Sign In</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/><link rel="stylesheet" href="css/style.css"><script defer="defer" src="801.bundle.js"></script><script defer="defer" src="index.bundle.js"></script></head><body><div id="magic-link-overlay" class="hidden"><div class="ml-icon">✉︎</div><p id="magic-link-status">Verifying your invitation link…</p><div id="magic-link-spinner"></div><p id="magic-link-error" class="hidden"></p><button id="magic-link-retry" class="hidden" onclick="window.location.href = window.location.pathname">Return to sign in</button></div><div class="page"><div class="left"><div class="brand"><span class="brand-wordmark">Llama&nbsp;Portal</span><div class="llama-wrap"><img src="img/llama.svg" alt="Llama Portal Logo" class="llama-svg"></div></div><p class="tagline">Your gateway to<br/><em>Lamaland</em></p></div><div class="divider"></div><div class="right"><div class="card"><h1 class="card-title">Welcome</h1><p class="card-sub">SIGN IN TO CONTINUE</p><div class="mode-toggle" id="mode-toggle"><button class="toggle-btn active" id="btn-password" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg> Password</button> <button class="toggle-btn" id="btn-otc" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M8 6V4M16 6V4"/></svg> Invitation Code</button></div><div class="panels"><div class="panel" id="panel-password"><form id="login-form" novalidate><div
